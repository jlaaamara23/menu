spring.application.name=Restaurant Menu
server.port=8080

# H2 file database
spring.datasource.url=jdbc:h2:file:./data/menudb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
app.jwt.secret=MaisonOliveaRestaurantMenuJwtSecretKey2026VeryLongRandomStringForHS256SecurityX9kQm2Lp7Nv
app.jwt.expiration-ms=86400000

# Uploads
app.upload.dir=./uploads

# CORS
app.cors.allowed-origins=http://localhost:5173

