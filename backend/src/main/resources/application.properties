spring.application.name=Restaurant Menu
server.port=${PORT:8080}

# H2 file database (ephemeral on free Render — use Postgres for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/menudb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
app.jwt.secret=${APP_JWT_SECRET:MaisonOliveaRestaurantMenuJwtSecretKey2026VeryLongRandomStringForHS256SecurityX9kQm2Lp7Nv}
app.jwt.expiration-ms=86400000

# Uploads
app.upload.dir=./uploads

# CORS — comma-separated origins (add your Render static site URL)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

